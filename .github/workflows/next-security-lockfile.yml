name: Next.js security lockfile update
on:
  push:
    branches: [redesign-v2]
    paths:
      - .github/workflows/next-security-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile with patched Next.js and sharp
        run: npm install --package-lock-only
      - name: Install locked dependencies
        run: npm ci
      - name: Verify patched dependency versions
        run: npm ls next sharp
      - name: Build
        run: npm run build
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Next.js and sharp security patch lockfile"
            git push origin HEAD:redesign-v2
          fi
