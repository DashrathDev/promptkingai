name: Next.js security lockfile update
on:
  push:
    branches: [redesign-v2]
    paths:
      - .github/workflows/next-security-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile with patched dependencies
        run: npm install --package-lock-only
      - name: Install locked dependencies
        run: npm ci
      - name: Verify patched dependency versions
        run: |
          npm ls next sharp source-map-js
          node -e "const p=require('./package-lock.json').packages; for(const [name,v] of Object.entries({'node_modules/next':'16.4.1','node_modules/sharp':'0.35.5','node_modules/source-map-js':'1.2.2'})){if(p[name]?.version!==v)throw Error(name+' is '+p[name]?.version+', expected '+v)}"
      - name: Build
        run: npm run build
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Next.js 16.4.1 security lockfile"
            git push origin HEAD:redesign-v2
          fi
